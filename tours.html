<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Tours — Zentra VR3D</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#071525;--navy-2:#0b1e33;--gold:#C8A96A;--gold-light:#E8CE86;
  --neon:#26d8f5;--neon-soft:rgba(38,216,245,.16);--neon-line:rgba(38,216,245,.55);
  --body:#B0C4D6;--muted:#6F8FA5;--hair:rgba(200,169,106,.15);
  --glass:rgba(11,28,47,.55);--glass-brd:rgba(255,255,255,.09);
  --r:16px;--r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:
    radial-gradient(1100px 620px at 12% -8%,rgba(201,162,39,.10),transparent 60%),
    radial-gradient(900px 520px at 92% 2%,rgba(38,216,245,.07),transparent 55%),
    var(--navy);
  color:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased;
}
a{color:inherit}

/* ─── Top bar ─── */
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px) saturate(140%);background:rgba(7,21,37,.72);border-bottom:1px solid var(--hair)}
.top .in{max-width:1240px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:.16em;font-size:13.5px;color:#fff;text-decoration:none;white-space:nowrap}
.brand em{font-style:normal;color:var(--gold-light)}
.top nav{display:flex;gap:6px;align-items:center}
.top nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;padding:7px 15px;border-radius:100px;transition:color .2s,background .2s}
.top nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
.top nav a[aria-current]{color:#fff;background:var(--neon-soft);box-shadow:inset 0 0 0 1px var(--neon-line)}

/* ─── Layout ─── */
.wrap{max-width:1240px;margin:0 auto;padding:40px 22px 80px}
h1{font-family:'Manrope',sans-serif;font-size:32px;font-weight:800;color:#fff;letter-spacing:-.01em}
.sub{font-size:14px;color:var(--muted);margin-top:7px}

/* ─── Floating toolbar ─── */
.toolbar{
  position:sticky;top:64px;z-index:15;margin:24px 0 28px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  padding:12px 14px;border-radius:var(--r);
  background:var(--glass);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--glass-brd);box-shadow:0 10px 34px rgba(0,0,0,.32);
}
.search{position:relative;flex:1 1 230px;min-width:180px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{
  width:100%;padding:10px 14px 10px 38px;font:inherit;font-size:13.5px;color:#fff;
  background:rgba(4,14,25,.55);border:1px solid var(--glass-brd);border-radius:100px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--neon-line);box-shadow:0 0 0 3px var(--neon-soft)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{
  font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
  padding:8px 16px;border-radius:100px;background:rgba(255,255,255,.03);
  border:1px solid var(--glass-brd);transition:all .2s;
}
.pill:hover{color:#fff;border-color:rgba(38,216,245,.35)}
.pill[aria-pressed="true"]{color:#04121d;background:var(--neon);border-color:var(--neon);box-shadow:0 0 18px rgba(38,216,245,.32)}
.count{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap;padding-right:4px}

/* ─── Grid: fills the row, no wasted space ─── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:20px}

/* ─── Glass card ─── */
.card{
  position:relative;display:flex;flex-direction:column;text-decoration:none;
  border-radius:var(--r);overflow:hidden;
  background:linear-gradient(158deg,rgba(255,255,255,.065),rgba(255,255,255,.015));
  backdrop-filter:blur(14px) saturate(145%);
  border:1px solid var(--glass-brd);
  transition:transform .35s cubic-bezier(.2,.7,.3,1),border-color .3s,box-shadow .35s;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);outline:none;
  border-color:var(--neon-line);
  box-shadow:0 0 0 1px var(--neon-line),0 14px 44px rgba(38,216,245,.16),0 10px 30px rgba(0,0,0,.35);
}
.card-thumb{position:relative;width:100%;aspect-ratio:2/1;overflow:hidden;background:var(--navy-2)}
.card-thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.02);transform-origin:50% 50%;
  transition:transform 6s cubic-bezier(.22,.6,.3,1);
}
.card:hover .card-thumb img,.card:focus-visible .card-thumb img{transform:scale(1.16) translateX(-2.5%)}
.card-thumb::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(4,12,22,.05) 35%,rgba(4,12,22,.72) 100%);
}
.pano-tag{
  position:absolute;top:11px;left:11px;z-index:2;
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 10px;border-radius:100px;color:var(--neon);
  background:rgba(4,14,25,.66);border:1px solid var(--neon-line);backdrop-filter:blur(6px);
}
.enter{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;
  opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;
}
.card:hover .enter,.card:focus-visible .enter{opacity:1;transform:none}
.enter .ring{
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:rgba(38,216,245,.14);border:1px solid var(--neon);
  box-shadow:0 0 26px rgba(38,216,245,.45);color:var(--neon);
}
.enter .lbl{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.card-body{padding:14px 16px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.card-body .album{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);
}
.card-body h3{font-family:'Manrope',sans-serif;font-size:15px;font-weight:700;color:#fff;line-height:1.3}
.card-body .prop{font-size:12px;color:var(--muted);line-height:1.35;flex:1}
.card-meta{display:flex;align-items:center;gap:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;color:var(--muted)}
.card-meta span{display:flex;align-items:center;gap:5px}
.card-meta svg{color:var(--neon);opacity:.85;flex-shrink:0}

/* ─── States ─── */
.empty{text-align:center;padding:70px 20px;grid-column:1/-1}
.empty h2{font-family:'Manrope',sans-serif;font-size:20px;color:var(--gold);margin-bottom:8px}
.empty p{font-size:14px;color:var(--muted)}
.empty code{display:inline-block;margin-top:16px;padding:10px 18px;background:var(--glass);border:1px solid var(--hair);border-radius:var(--r-sm);font-size:13px;color:var(--gold)}
.spinner{display:block;width:28px;height:28px;border:2px solid rgba(38,216,245,.12);border-top-color:var(--neon);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:640px){
  .wrap{padding:26px 16px 56px}
  h1{font-size:23px}
  .toolbar{top:58px;padding:10px;gap:9px}
  .count{margin-left:0;width:100%;padding:0}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .card:hover .card-thumb img,.card:focus-visible .card-thumb img{transform:scale(1.02)}
}
</style>
</head>
<body>

<div class="top">
  <div class="in">
    <a href="/" class="brand"><span>ZENTRA <em>VR3D</em></span></a>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="tours.html" aria-current="page">Browse</a>
    </nav>
  </div>
</div>

<div class="wrap">
  <h1>Virtual Tours</h1>
  <p class="sub">Step inside before you visit — 360° walkthroughs of every unit.</p>

  <div class="toolbar">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
      <input id="q" type="search" placeholder="Search tours, properties…" autocomplete="off" aria-label="Search tours">
    </label>
    <div class="pills" id="pills" role="group" aria-label="Filter by category"></div>
    <span class="count" id="count" role="status" aria-live="polite"></span>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICON_SCENES = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>';
const ICON_DATE   = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';
const ICON_PLAY   = '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>';

const ALL = 'All';
let TOURS = [], CATS = [], active = ALL;

/* Category: explicit field wins; otherwise derive from the title. */
function categoryOf(t) {
  if (t.category) return t.category;
  const s = (t.title || '') + ' ' + (t.album || '');
  if (/workspace|office|co-?working/i.test(s)) return 'Workspaces';
  if (/soho/i.test(s)) return 'SOHO';
  return 'Apartments';
}

const albumNameOf = t => {
  const a = t.album;
  if (!a) return '';
  if (typeof a === 'string') return a;
  return a.name || a.title || '';
};

function card(t) {
  const n = (t.scenes || []).length;
  const pano = t.thumb || ((t.scenes || [])[0] || {}).panorama || '';
  const album = albumNameOf(t);
  return '<a class="card" href="tour.html?id=' + encodeURIComponent(t.id) + '">' +
    '<div class="card-thumb">' +
      (pano ? '<img src="' + esc(pano) + '" alt="" loading="lazy" decoding="async">' : '') +
      '<span class="pano-tag">360°</span>' +
      '<span class="enter" aria-hidden="true"><span class="ring">' + ICON_PLAY + '</span>' +
        '<span class="lbl">Enter 360°</span></span>' +
    '</div>' +
    '<div class="card-body">' +
      (album ? '<span class="album">' + esc(album) + '</span>' : '') +
      '<h3>' + esc(t.title || t.id) + '</h3>' +
      (t.property ? '<span class="prop">' + esc(t.property) + '</span>' : '<span class="prop"></span>') +
      '<div class="card-meta">' +
        '<span>' + ICON_SCENES + n + ' scene' + (n === 1 ? '' : 's') + '</span>' +
        (t.created ? '<span>' + ICON_DATE + esc(t.created) + '</span>' : '') +
      '</div>' +
    '</div></a>';
}

function matches(t) {
  if (active !== ALL && categoryOf(t) !== active) return false;
  const q = ($('#q').value || '').trim().toLowerCase();
  if (!q) return true;
  return ((t.title || '') + ' ' + (t.property || '') + ' ' + albumNameOf(t)).toLowerCase().includes(q);
}

function render() {
  const host = $('#grid');
  const shown = TOURS.filter(matches);

  if (!TOURS.length) {
    host.innerHTML = '<div class="empty"><h2>No tours yet</h2><p>Create your first tour with the stitch pipeline.</p>' +
      '<code>python3 stitch.py ./photos/ --output assets/panorama.jpg<br>python3 add_tour.py assets/panorama.jpg --name "My Property"</code></div>';
    $('#count').textContent = '';
    return;
  }

  host.innerHTML = shown.length
    ? shown.map(card).join('')
    : '<div class="empty"><h2>No match</h2><p>Nothing matches that search or filter.</p></div>';

  $('#count').textContent = shown.length + ' of ' + TOURS.length + ' tours';
}

function buildPills() {
  $('#pills').innerHTML = [ALL, ...CATS].map(c =>
    '<button class="pill" type="button" data-cat="' + esc(c) + '" aria-pressed="' +
    (c === active) + '">' + esc(c) + '</button>').join('');
}

$('#pills').addEventListener('click', e => {
  const b = e.target.closest('.pill');
  if (!b) return;
  active = b.dataset.cat;
  [...$('#pills').children].forEach(p => p.setAttribute('aria-pressed', String(p === b)));
  render();
});

$('#q').addEventListener('input', render);

(async function loadTours() {
  const host = $('#grid');
  host.innerHTML = '<div class="empty"><div class="spinner"></div><p style="font-size:13px">Loading tours…</p></div>';

  let ids = [];
  try {
    const r = await fetch('/tours/manifest.json', {cache: 'no-store'});
    if (r.ok) ids = await r.json();
  } catch (e) {}
  if (!Array.isArray(ids)) ids = Array.isArray(ids.tours) ? ids.tours : [];

  for (const id of ids) {
    try {
      const res = await fetch('/tours/' + id + '.json', {cache: 'no-store'});
      if (!res.ok) continue;
      TOURS.push(await res.json());
    } catch (e) {}
  }

  CATS = [...new Set(TOURS.map(categoryOf))].sort();
  buildPills();
  render();
})();
</script>
</body>
</html>
