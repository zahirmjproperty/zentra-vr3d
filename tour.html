<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Zentra VR3D — Virtual Tour</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#071525;--navy-light:#0d1f33;--gold:#C8A96A;--gold-light:#E8CE86;--cyan:#63E5FF;--body:#B0C4D6;--muted:#6F8FA5;--glass:rgba(7,21,37,.78);--hair:rgba(200,169,106,.2);--radius:12px;--radius-sm:8px;--font:'Inter',system-ui,sans-serif;--font-display:'Manrope',var(--font)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--navy);color:#e8edf2}
.pnlm-about-msg{display:none!important}
.pnlm-compass{filter:hue-rotate(320deg) saturate(1.5)}
.pnlm-hotspot-list{font-family:var(--font)!important}

/* Top bar */
#topbar{position:fixed;top:0;left:0;right:0;z-index:999;
  background:rgba(7,21,37,.7);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair);
  padding:10px 20px;display:flex;align-items:center;justify-content:space-between;transition:opacity .4s}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;
  font-family:var(--font-display);font-weight:700;font-size:15px}
.brand .mark{width:26px;height:26px;background:var(--gold);border-radius:4px;display:flex;
  align-items:center;justify-content:center;color:var(--navy);font-weight:800;font-size:13px}#topbar a{text-decoration:none}
.brand em{color:var(--gold);font-style:normal}
#topbar .actions{display:flex;gap:6px}
#topbar .actions a{color:var(--muted);font-size:13px;font-weight:500;padding:6px 14px;border-radius:100px;transition:all .2s;border:1px solid transparent;cursor:pointer}
#topbar .actions a:hover{color:#fff;background:rgba(200,169,106,.06)}
.top-info{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--muted)}
.top-info strong{color:#fff;font-weight:600}

/* Bottom bar */
#ui{position:fixed;bottom:0;left:0;right:0;z-index:999;
  background:linear-gradient(transparent,rgba(7,21,37,.85) 40%);padding:36px 20px 18px;pointer-events:none;transition:opacity .4s}
#ui.hidden{opacity:0;pointer-events:none}
#ui>*{pointer-events:auto}
.ui-bar{max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.scene-info{flex:1;min-width:180px}
.scene-info .prop-name{font-family:var(--font-display);font-size:15px;font-weight:700}
.scene-info .scene-name{font-size:12px;color:var(--muted);margin-top:2px}
.scene-nav{display:flex;gap:6px;flex-wrap:wrap}
.scene-btn{padding:7px 16px;border-radius:100px;font-size:12.5px;font-weight:600;
  border:1px solid var(--hair);background:var(--glass);color:var(--muted);cursor:pointer;
  backdrop-filter:blur(8px);transition:all .2s;font-family:var(--font)}
.scene-btn:hover{border-color:var(--gold);color:#fff;background:rgba(200,169,106,.1)}
.scene-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(200,169,106,.15)}

/* Loading */
#loading{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--navy);transition:opacity .5s}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid rgba(200,169,106,.1);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:14px;color:var(--muted)}

/* Scene panel */
#panel{position:fixed;top:56px;right:0;z-index:998;width:280px;max-height:calc(100vh - 80px);overflow-y:auto;
  background:rgba(7,21,37,.95);backdrop-filter:blur(16px);border-left:1px solid var(--hair);border-bottom:1px solid var(--hair);
  border-radius:0 0 0 var(--radius);padding:16px;transform:translateX(100%);transition:transform .3s}
#panel.open{transform:translateX(0)}
#panel h3{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.scene-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;margin-bottom:4px}
.scene-item:hover{background:rgba(200,169,106,.06)}
.scene-item.active{background:rgba(200,169,106,.1);border-left:2px solid var(--gold)}
.scene-item .thumb{width:44px;height:44px;border-radius:6px;background:var(--navy-light);overflow:hidden;flex-shrink:0}
.scene-item .thumb img{width:100%;height:100%;object-fit:cover}
.scene-item .label{flex:1;min-width:0}
.scene-item .title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene-item .sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Error */
#error{position:fixed;inset:0;z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--navy);text-align:center;padding:24px}
#error.show{display:flex}
#error h2{font-family:var(--font-display);font-size:22px;color:var(--gold);margin-bottom:8px}
#error p{font-size:14px;color:var(--muted);margin-bottom:16px;max-width:360px}

@media(max-width:640px){
  #panel{width:240px}
  .scene-info .prop-name{font-size:14px}
  #topbar{padding:8px 14px}
  .brand{font-size:13px}
  .brand .mark{width:22px;height:22px;font-size:11px}
  #topbar .actions a{font-size:12px;padding:5px 10px}
  #ui{padding:28px 14px 14px}
  .scene-btn{padding:6px 12px;font-size:11.5px}
}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Loading virtual tour...</p></div>

<div id="error">
  <h2>Tour not found</h2>
  <p id="error-msg">Could not load this tour.</p>
  <a href="tours.html" style="color:var(--gold);font-size:14px;text-decoration:none;padding:8px 20px;border:1px solid var(--hair);border-radius:100px;margin-top:4px">← Browse Tours</a>
</div>

<div id="topbar">
  <a href="/"><div class="brand"><div class="mark">Z</div><span>ZENTRA <em>VR3D</em></span></div></a>
  <div class="actions">
    <span class="top-info" id="topInfo"></span>
    <a href="#" id="togglePanelBtn">Scenes</a>
    <a href="#" onclick="document.querySelector('#pano').requestFullscreen()">Fullscreen</a>
  </div>
</div>

<div id="pano"></div>

<div id="ui">
  <div class="ui-bar">
    <div class="scene-info">
      <div class="prop-name" id="propName">—</div>
      <div class="scene-name" id="sceneName">Loading…</div>
    </div>
    <div class="scene-nav" id="sceneNav"></div>
  </div>
</div>

<div id="panel">
  <h3>Scenes</h3>
  <div id="sceneList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
// ── Dynamic tour loader ──
const tourId = new URLSearchParams(window.location.search).get('id') || 'demo-001';

(async function() {
  try {
    const res = await fetch('/tours/' + tourId + '.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const tour = await res.json();
    initTour(tour);
  } catch(e) {
    document.getElementById('error-msg').textContent = 'Could not load "' + tourId + '". The tour may not exist or is still being built.';
    document.getElementById('error').classList.add('show');
    document.getElementById('loading').classList.add('hidden');
  }
})();

let viewer;
const sceneKeys = [];

function initTour(tour) {
  const scenes = tour.scenes;
  sceneKeys.push(...scenes.map(s => s.id));

  // Info bar
  document.getElementById('topInfo').innerHTML = '<strong>' + tour.title + '</strong> · ' + scenes.length + ' scene' + (scenes.length > 1 ? 's' : '');

  // Build scene nav buttons
  const nav = document.getElementById('sceneNav');
  scenes.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'scene-btn';
    btn.dataset.scene = s.id;
    btn.textContent = s.title;
    btn.onclick = () => loadScene(s.id);
    nav.appendChild(btn);
  });

  // Build panel list
  const list = document.getElementById('sceneList');
  scenes.forEach(s => {
    const item = document.createElement('div');
    item.className = 'scene-item';
    item.dataset.scene = s.id;
    item.onclick = () => { loadScene(s.id); closePanel(); };
    item.innerHTML = '<div class="thumb"><img src="' + s.panorama + '" alt="" loading="lazy"></div><div class="label"><div class="title">' + s.title + '</div><div class="sub">' + (s.description || '') + '</div></div>';
    list.appendChild(item);
  });

  // Load first scene
  loadScene(scenes[0].id);
}

function loadScene(sceneId) {
  const tourData = sceneKeys.reduce((acc, id) => { acc[id] = null; return acc; }, {});
  // We need to find the scene in the tour data - but we stored scenes in the fetch result
  // Let's re-fetch in a simple way
  loadSceneDirect(sceneId);
}

let allScenes = [];

function loadSceneDirect(sceneId) {
  // Fetch tour data from the initial load (stored in closure)
  // Actually we need to access the tour data again. Let me restructure.
  // The simpler approach: pass the data around.
  document.getElementById('sceneName').textContent = 'Loading…';
  
  // The viewer will update on scene change callback
}

// ── Rewrite with proper data flow ──
// Since we need the tour data accessible, let's use the pannellum config approach instead

(function() {
  const params = new URLSearchParams(window.location.search);
  const tourId = params.get('id') || 'demo-001';
  let viewer = null;
  let scenes = [];

  loadTourData(tourId);

  async function loadTourData(id) {
    try {
      const res = await fetch('/tours/' + id + '.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const tour = await res.json();
      scenes = tour.scenes;

      document.getElementById('propName').textContent = tour.title;
      document.getElementById('topInfo').innerHTML = '<strong>' + tour.title + '</strong> · ' + scenes.length + ' scene' + (scenes.length > 1 ? 's' : '');

      // Build nav buttons
      const nav = document.getElementById('sceneNav');
      scenes.forEach((s, i) => {
        const btn = document.createElement('button');
        btn.className = 'scene-btn' + (i === 0 ? ' active' : '');
        btn.dataset.scene = s.id;
        btn.textContent = s.title;
        btn.onclick = () => switchScene(s.id);
        nav.appendChild(btn);
      });

      // Build panel
      const list = document.getElementById('sceneList');
      scenes.forEach(s => {
        const item = document.createElement('div');
        item.className = 'scene-item';
        item.dataset.scene = s.id;
        item.onclick = () => { switchScene(s.id); document.getElementById('panel').classList.remove('open'); };
        item.innerHTML = '<div class="thumb"><img src="' + s.panorama + '" alt="" loading="lazy"></div><div class="label"><div class="title">' + s.title + '</div><div class="sub">' + (s.description || tour.title) + '</div></div>';
        list.appendChild(item);
      });

      // Build Pannellum multi-scene config
      const panoConfig = {
        type: 'multires',
        autoLoad: true,
        showFullscreenCtrl: false,
        compass: true,
        northOffset: 0,
        sceneFadeDuration: 500,
        strings: { loadSceneError: 'Failed to load scene.' },
        scenes: {}
      };

      scenes.forEach(s => {
        const hs = (s.hotSpots || []).map(h => ({
          pitch: h.pitch,
          yaw: h.yaw,
          type: h.type === 'scene' ? 'scene' : 'info',
          text: h.textHTML || h.text || '',
          sceneId: h.sceneId || undefined,
          targetYaw: h.targetYaw,
          targetPitch: h.targetPitch,
          cssClass: h.type === 'scene' ? 'custom-hotspot' : 'info-hotspot'
        }));

        panoConfig.scenes[s.id] = {
          title: s.title,
          type: 'equirectangular',
          panorama: s.panorama,
          autoLoad: true,
          compass: true,
          pitch: (s.initial || {}).pitch || 0,
          yaw: (s.initial || {}).yaw || 0,
          hfov: (s.initial || {}).hfov || 100,
          hotSpots: hs
        };
      });

      panoConfig.default = { firstScene: scenes[0].id };

      viewer = pannellum.viewer('pano', panoConfig);

      viewer.on('scenechange', function(id) {
        const s = scenes.find(x => x.id === id);
        if (s) {
          document.getElementById('sceneName').textContent = s.title;
          document.querySelectorAll('.scene-btn').forEach(b => b.classList.toggle('active', b.dataset.scene === id));
          document.querySelectorAll('.scene-item').forEach(i => i.classList.toggle('active', i.dataset.scene === id));
        }
      });

      viewer.on('load', function() {
        document.getElementById('loading').classList.add('hidden');
      });

      document.getElementById('sceneName').textContent = scenes[0].title;
      document.querySelectorAll('.scene-btn')[0]?.classList.add('active');
      document.querySelectorAll('.scene-item')[0]?.classList.add('active');

    } catch(e) {
      console.error('Tour load error:', e);
      document.getElementById('error-msg').textContent = 'Could not load "' + tourId + '". The tour may not exist.';
      document.getElementById('error').classList.add('show');
      document.getElementById('loading').classList.add('hidden');
    }
  }

  window.switchScene = function(id) {
    if (viewer) viewer.loadScene(id);
  };

  document.getElementById('togglePanelBtn').onclick = function(e) {
    e.preventDefault();
    document.getElementById('panel').classList.toggle('open');
  };

  document.addEventListener('click', function(e) {
    const panel = document.getElementById('panel');
    if (panel.classList.contains('open') && !panel.contains(e.target) && e.target.id !== 'togglePanelBtn') {
      panel.classList.remove('open');
    }
  });

  // Auto-hide UI
  let uiTimer;
  document.addEventListener('mousemove', function() {
    document.getElementById('ui').classList.remove('hidden');
    document.getElementById('topbar').style.opacity = '1';
    clearTimeout(uiTimer);
    uiTimer = setTimeout(function() {
      document.getElementById('ui').classList.add('hidden');
      document.getElementById('topbar').style.opacity = '0';
    }, 4000);
  });
  document.addEventListener('touchstart', function() {
    document.getElementById('ui').classList.toggle('hidden');
  });

})();
</script>
</body>
</html>
