<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Codes — Zentra VR3D</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#071525;--navy-light:#0d1f33;--gold:#C8A96A;--gold-light:#E8CE86;--body:#B0C4D6;--muted:#6F8FA5;--glass:rgba(7,21,37,.78);--hair:rgba(200,169,106,.15);--panel:rgba(18,40,63,.65)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(1100px 620px at 12% -8%,rgba(201,162,39,.12),transparent 60%),radial-gradient(900px 520px at 92% 4%,rgba(201,162,39,.06),transparent 55%),var(--navy);color:var(--body);min-height:100vh}
.top{position:sticky;top:0;z-index:6;backdrop-filter:blur(14px);background:rgba(7,21,37,.78);border-bottom:1px solid var(--hair)}
.top .in{max-width:1120px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:.16em;font-size:13.5px;color:#fff;text-decoration:none}
.brand em{font-style:normal;color:var(--gold-light)}
.top a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;padding:6px 14px;border-radius:100px;transition:all .2s}
.top a:hover{color:#fff;background:rgba(200,169,106,.06)}
.wrap{max-width:800px;margin:0 auto;padding:40px 22px 60px}
h1{font-family:'Manrope',sans-serif;font-size:24px;font-weight:800;color:#fff;margin-bottom:4px}
.sub{font-size:13px;color:var(--muted);margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.card{background:#fff;border-radius:14px;overflow:hidden;text-align:center;padding:18px;text-decoration:none;color:inherit;transition:all .2s;border:1px solid transparent}
.card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 20px rgba(200,169,106,.15)}
.card img{width:100%;max-width:180px;height:auto;display:block;margin:0 auto 10px;border-radius:6px}
.card .label{font-size:11px;color:var(--navy);font-weight:600;line-height:1.3}
.card .tiny{font-size:9px;color:#6B7280;margin-top:3px}
.dl-btn{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:100px;font-size:11px;font-weight:600;color:var(--gold);text-decoration:none;background:rgba(200,169,106,.1);transition:all .2s}
.dl-btn:hover{background:rgba(200,169,106,.2)}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .card{padding:12px}
}
</style>
</head>
<body>
<div class="top">
  <div class="in">
    <a href="/" class="brand"><span>ZENTRA <em>VR3D</em></span></a>
    <div><a href="tours.html">Tours</a></div>
  </div>
</div>
<div class="wrap">
  <h1>QR Codes</h1>
  <p class="sub">Download QR codes for print materials — each links directly to a VR tour.</p>
  <div class="grid" id="qrGrid"></div>
</div>

<script>
async function loadQRs() {
  const grid = document.getElementById('qrGrid');

  try {
    const res = await fetch('/tours/manifest.json');
    const ids = await res.json();
    
    if (ids.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)"><p style="font-size:14px">No tours yet.</p></div>';
      return;
    }

    // Load each tour for titles
    const tours = [];
    for (const id of ids) {
      try {
        const r = await fetch(`/tours/${id}.json`);
        const t = await r.json();
        tours.push(t);
      } catch {
        tours.push({id, title: id});
      }
    }

    grid.innerHTML = tours.map(t => {
      const id = t.id;
      const label = t.title || id;
      const qrPath = `/assets/qr/${id}.png`;
      const tourUrl = `/tour.html?id=${id}`;
      return `<div class="card">
        <img src="${qrPath}" alt="QR for ${label}" loading="lazy">
        <div class="label">${label}</div>
        <div class="tiny">Scan to view VR tour</div>
        <a href="${qrPath}" download class="dl-btn">⬇ Download PNG</a>
      </div>`;
    }).join('');

  } catch(e) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)"><p>Could not load QR codes.</p></div>';
  }
}

loadQRs();
</script>
</body>
</html>
