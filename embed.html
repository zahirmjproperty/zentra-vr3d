<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Zentra VR3D — Embed</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
#pano{width:100%;height:100%}
.pnlm-about-msg{display:none!important}
.pnlm-ui,.pnlm-controls-container{z-index:2!important}

/* Minimal scene nav for embed */
#embed-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:6px;padding:8px 14px;background:rgba(7,21,37,.7);border:1px solid rgba(200,169,106,.2);
  border-radius:12px;backdrop-filter:blur(10px);
  max-width:calc(100% - 24px);overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
#embed-nav::-webkit-scrollbar{display:none}
.embed-btn{flex:0 0 auto;white-space:nowrap;padding:5px 12px;border-radius:8px;border:none;font-size:11px;font-weight:600;
  color:#8a9aa8;background:rgba(255,255,255,.06);cursor:pointer;transition:all .2s;font-family:-apple-system,sans-serif}
.embed-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.embed-btn.active{background:rgba(200,169,106,.2);color:#E8CE86}
/* Nama scene sudah dipapar pada butang nav aktif — buang kotak tajuk Pannellum
   supaya ia tidak bertindih dengan bar nav dalam iframe kecil (disemak 6 Okt 2026). */
.pnlm-title-box{display:none!important}
/* Iframe pendek (cth. telefon dalam halaman projek): rapatkan bar nav. */
@media(max-height:340px){
  #embed-nav{bottom:10px;padding:6px 10px;gap:5px;max-width:calc(100% - 16px)}
  .embed-btn{padding:4px 9px;font-size:10px}
}
/* Kompas Pannellum berada di bawah-kanan dan bertindih dengan bar nav pada
   SEMUA saiz iframe — naikkan ia supaya kekal boleh diklik (disemak 6 Okt 2026). */
.pnlm-compass{bottom:60px!important}

/* Loading */
#loader{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#071525;transition:opacity .5s}
#loader.hidden{opacity:0;pointer-events:none}
.spinner{width:24px;height:24px;border:2px solid rgba(200,169,106,.1);border-top-color:#C8A96A;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>
<div id="pano"></div>
<div id="embed-nav"></div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
(async function(){
  const tourId = new URLSearchParams(location.search).get('id') || 'armani-a1';
  try {
    const res = await fetch('/tours/' + tourId + '.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const tour = await res.json();
    const scenes = tour.scenes;
    
    // Build nav
    const nav = document.getElementById('embed-nav');
    scenes.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.className = 'embed-btn' + (i === 0 ? ' active' : '');
      btn.dataset.scene = s.id;
      btn.textContent = s.title;
      btn.onclick = () => viewer.loadScene(s.id);
      nav.appendChild(btn);
    });
    
    // Build config
    const config = {
      autoLoad: true,
      showControls: true,
      showFullscreenCtrl: true,
      showZoomCtrl: true,
      compass: true,
      hotSpotDebug: false,
      sceneFadeDuration: 400,
      strings: { loadSceneError: '' },
      scenes: {}
    };
    
    scenes.forEach(s => {
      const hs = (s.hotSpots || []).map(h => ({
        pitch: h.pitch, yaw: h.yaw,
        type: h.type === 'scene' ? 'scene' : 'info',
        text: h.textHTML || h.text || '',
        sceneId: h.sceneId,
        targetYaw: h.targetYaw, targetPitch: h.targetPitch
      }));
      
      config.scenes[s.id] = {
        title: s.title,
        type: 'equirectangular',
        panorama: s.panorama,
        autoLoad: true,
        pitch: (s.initial || {}).pitch || 0,
        yaw: (s.initial || {}).yaw || 0,
        hfov: (s.initial || {}).hfov || 100,
        hotSpots: hs
      };
    });
    
    config.default = { firstScene: scenes[0].id };
    
    const viewer = pannellum.viewer('pano', config);
    viewer.on('scenechange', id => {
      document.querySelectorAll('.embed-btn').forEach(b => b.classList.toggle('active', b.dataset.scene === id));
    });
    viewer.on('load', () => document.getElementById('loader').classList.add('hidden'));
    
  } catch(e) {
    document.getElementById('loader').innerHTML = '<p style="color:#8a9aa8;font-family:sans-serif;font-size:13px">Tour not found</p>';
  }
})();
</script>
</body>
</html>
